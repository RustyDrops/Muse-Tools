<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:720px;height:720px;background:#f7f3ea;font-family:Georgia,serif;overflow:hidden}
  #stage{position:relative;width:720px;height:720px}
  .letter{display:inline-block;font-size:92px;font-weight:bold;color:#22303c}
  #title{position:absolute;top:150px;width:720px;text-align:center}
  #card{position:absolute;left:110px;top:330px;width:500px;height:170px;background:#fff;border:2px solid #22303c;border-radius:18px;box-shadow:0 10px 0 rgba(34,48,60,.15)}
  #card p{font-size:30px;color:#44515c;text-align:center;margin:62px 20px}
  #barWrap{position:absolute;left:110px;top:560px;width:500px;height:22px;background:#ddd3bd;border-radius:11px}
  #bar{width:500px;height:22px;background:#c96f2e;border-radius:11px;transform-origin:left center}
  #dot{position:absolute;left:330px;top:60px;width:60px;height:60px;border-radius:50%;background:#c96f2e}
</style></head><body>
<div id="stage">
  <div id="dot"></div>
  <div id="title"><span class="letter">G</span><span class="letter">S</span><span class="letter">A</span><span class="letter">P</span></div>
  <div id="card"><p>Timeline scrub test: seek(t), no clock</p></div>
  <div id="barWrap"><div id="bar"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({paused:true, defaults:{ease:"power3.out"}});
  tl.from(".letter", {y:120, opacity:0, rotation:8, duration:0.7, ease:"back.out(2.2)", stagger:0.09}, 0)
    .from("#dot", {scale:0, duration:0.5, ease:"elastic.out(1,0.5)"}, 0.1)
    .from("#card", {y:80, opacity:0, duration:0.6}, 0.5)
    .from("#bar", {scaleX:0, duration:1.6, ease:"power2.inOut"}, 0.7)
    .to("#dot", {y:40, duration:0.4, yoyo:true, repeat:1, ease:"sine.inOut"}, 1.8);
  window.__duration = tl.duration();
  window.renderAt = function(t){ tl.seek(t, false); };
  window.__ready = true;
</script></body></html>
