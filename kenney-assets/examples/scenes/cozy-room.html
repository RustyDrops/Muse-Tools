<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cozy Room: a Kenney Furniture Kit game scene</title>
<style>
  body { margin:0; background:#141a22; color:#eef3f8; font-family:Arial, sans-serif; overflow:hidden; }
  #hud { position:absolute; top:10px; left:12px; background:rgba(0,0,0,.5); padding:9px 13px; border-radius:9px; font-size:16px; line-height:1.5; }
  #win { position:absolute; top:42%; left:50%; transform:translate(-50%,-50%); background:rgba(20,30,20,.85); padding:18px 30px; border-radius:14px; font-size:30px; display:none; }
  canvas { display:block; }
</style>
<script type="importmap">
{ "imports": { "three": "./three.module.js" } }
</script>
</head>
<body>
<div id="hud"><b>Cozy Room</b> &nbsp; WASD or arrow keys to walk &nbsp;|&nbsp; Orbs: <span id="count">0</span> / 3<br>
<small>Every model scaled and grounded by tools/kenney-fit.js from manifest.json. No hand-typed scale numbers.</small></div>
<div id="win">Room explored. All 3 orbs found.</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './GLTFLoader.js';
import { loadScene, footprintOverlaps } from './tools/kenney-fit.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a222d);
const camera = new THREE.PerspectiveCamera(52, 1100/700, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(1100, 700);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xfff2df, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(5, 8, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0xaac4ff, 0.4);
fill.position.set(-5, 4, -2); scene.add(fill);

// Room: 9 x 7 m floor, two low walls
const floor = new THREE.Mesh(new THREE.BoxGeometry(9, 0.1, 7),
  new THREE.MeshStandardMaterial({ color: 0x51606f, roughness: 1 }));
floor.position.y = -0.05; scene.add(floor);
const wallMat = new THREE.MeshStandardMaterial({ color: 0x39485a, roughness: 1 });
const backWall = new THREE.Mesh(new THREE.BoxGeometry(9, 2.6, 0.15), wallMat);
backWall.position.set(0, 1.3, -3.55); scene.add(backWall);
const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.6, 7), wallMat);
leftWall.position.set(-4.55, 1.3, 0); scene.add(leftWall);
const grid = new THREE.GridHelper(9, 9, 0x71879c, 0x5a6c80);
grid.scale.z = 7/9; grid.position.y = 0.002; scene.add(grid);

// Scale reference pole, 0.5 m bands, 2 m total
const bandColors = [0xf2604c, 0xefefef, 0xf2604c, 0xefefef];
for (let i = 0; i < 4; i++) {
  const band = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.5, 0.09),
    new THREE.MeshStandardMaterial({ color: bandColors[i] }));
  band.position.set(4.25, 0.25 + i * 0.5, -3.2); scene.add(band);
}

// Furniture, all through the tool. Hosts come before stacked items.
const manifest = await (await fetch('manifest.json')).json();
const placements = {
  rugRectangle:      { at: [-1.2, 0.3] },
  loungeSofa:        { at: [-1.7, -1.5] },
  tableCoffee:       { at: [-1.7, -0.1] },
  books:             { on: 'tableCoffee', dx: -0.32, dz: 0.05 },
  bookcaseOpen:      { at: [3.85, -3.15] },
  cabinetTelevision: { at: [0.9, -3.2] },
  televisionModern:  { on: 'cabinetTelevision' },
  bedSingle:         { at: [3.35, 2.35] },
  desk:              { at: [-3.75, -2.95] },
  chairDesk:         { at: [-3.75, -1.95], rotY: Math.PI },
  laptop:            { on: 'desk', dz: -0.1 },
  pottedPlant:       { at: [4.15, -0.6] },
  lampSquareFloor:   { at: [-0.15, -3.15] },
};
let report, loadError = null;
try {
  ({ report } = await loadScene(new GLTFLoader(), manifest, placements, scene));
} catch (e) { loadError = String(e); }

// Player: simple capsule walker
const player = new THREE.Group();
const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 0.75, 6, 14),
  new THREE.MeshStandardMaterial({ color: 0xf2604c, roughness: 0.6 }));
body.position.y = 0.82; player.add(body);
const nose = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 10),
  new THREE.MeshStandardMaterial({ color: 0xffffff }));
nose.position.set(0, 1.25, 0.2); player.add(nose);
player.position.set(0.6, 0, 2.7);
scene.add(player);

// Orbs to collect
const orbPos = [ [3.85, -2.3], [0.9, -2.45], [3.35, 1.35] ];
const orbs = orbPos.map(([x, z]) => {
  const o = new THREE.Mesh(new THREE.SphereGeometry(0.17, 18, 18),
    new THREE.MeshStandardMaterial({ color: 0xffc93c, emissive: 0xa86e00, emissiveIntensity: 0.9 }));
  o.position.set(x, 1.05, z); scene.add(o); return o;
});
let collected = 0;
const keys = {};
addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const sp = 2.3 * dt;
  let moved = false;
  if (keys['w'] || keys['arrowup']) { player.position.z -= sp; moved = true; }
  if (keys['s'] || keys['arrowdown']) { player.position.z += sp; moved = true; }
  if (keys['a'] || keys['arrowleft']) { player.position.x -= sp; moved = true; }
  if (keys['d'] || keys['arrowright']) { player.position.x += sp; moved = true; }
  player.position.x = THREE.MathUtils.clamp(player.position.x, -4.2, 4.2);
  player.position.z = THREE.MathUtils.clamp(player.position.z, -3.2, 3.2);
  for (const o of orbs) {
    if (o.visible) {
      o.rotation.y += dt * 2;
      const d = Math.hypot(o.position.x - player.position.x, o.position.z - player.position.z);
      if (d < 0.55) {
        o.visible = false; collected++;
        document.getElementById('count').textContent = collected;
        if (collected === 3) document.getElementById('win').style.display = 'block';
      }
    }
  }
  const target = new THREE.Vector3(player.position.x * 0.45, 5.0, player.position.z * 0.45 + 6.8);
  camera.position.lerp(target, 0.06);
  camera.lookAt(player.position.x * 0.7, 0.5, player.position.z * 0.7 - 0.9);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

window.__REPORT = report;
window.__OVERLAPS = report ? footprintOverlaps(report, ['rugRectangle']) : null;
window.__ERROR = loadError;
window.__game = { player, orbs, get collected() { return collected; } };
window.__DONE = true;
</script>
</body>
</html>
